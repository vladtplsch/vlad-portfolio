<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplitsch Vladimir — Graphisme</title>
  <meta name="description" content="Portfolio de graphisme de Vladimir Toplitsch — édition, affiche et identité visuelle.">
  <meta name="theme-color" content="#000000">

  <!-- ⚠️ À remplacer par le vrai nom de domaine une fois le site hébergé
       (canonical, og:url, og:image et le JSON-LD plus bas en dépendent tous) -->
  <link rel="canonical" href="https://www.toplitsch-vladimir.ch/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Toplitsch Vladimir — Graphisme">
  <meta property="og:description" content="Portfolio de graphisme de Vladimir Toplitsch — édition, affiche et identité visuelle.">
  <meta property="og:image" content="https://www.toplitsch-vladimir.ch/images/IMG_2605.jpg">
  <meta property="og:url" content="https://www.toplitsch-vladimir.ch/">
  <meta property="og:locale" content="fr_CH">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Toplitsch Vladimir — Graphisme">
  <meta name="twitter:description" content="Portfolio de graphisme de Vladimir Toplitsch — édition, affiche et identité visuelle.">
  <meta name="twitter:image" content="https://www.toplitsch-vladimir.ch/images/IMG_2605.jpg">

  <link rel="stylesheet" href="style.css">

  <!-- Données structurées : aide les moteurs de recherche à identifier la
       personne derrière le site (résultats enrichis potentiels). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Vladimir Toplitsch",
    "jobTitle": "Graphiste",
    "url": "https://www.toplitsch-vladimir.ch/",
    "email": "mailto:vltoplitsch@gmail.com",
    "sameAs": ["https://www.instagram.com/vladtplsch"]
  }
  </script>
</head>
<body>

  <header>
    <h1 class="logo">toplitsch vladimir <span></span></h1>
    <nav>
      <a href="https://www.instagram.com/vladtplsch" target="_blank" rel="noopener noreferrer">instagram</a>
    </nav>
  </header>

  <!-- Pagination : un point par projet, généré et mis à jour en JS -->
  <nav class="pagination" id="pagination" aria-label="Navigation entre les projets"></nav>

  <main class="scroll-container" id="scrollContainer">

    <section class="intro" id="intro">
      <div class="project-content">
        <span class="project-meta project-tag">portfolio</span>
        <!-- Sommaire des projets : généré par script.js depuis le tableau
             "projects", pour rester toujours en phase avec les titres réels. -->
        <nav class="intro-nav" id="introNav" aria-label="Sommaire des projets"></nav>
        <span class="project-meta project-year">2026</span>
      </div>
    </section>

    <!-- Les sections projet (image de couverture, tag, titre, année) sont
         générées par script.js à partir du tableau "projects" : une seule
         source de vérité, partagée avec la page de détail et la pagination. -->

  </main>

  <footer>
    <span>lausanne – rue du maupas 4, 1004</span>
    <a href="mailto:vltoplitsch@gmail.com">vltoplitsch@gmail.com</a>
  </footer>

  <!-- Page de détail : un seul gabarit, rempli dynamiquement selon le projet cliqué -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <button class="detail-close" id="detailClose" type="button">fermer <span aria-hidden="true">×</span></button>
    <div class="detail-inner">
      <div class="detail-meta">
        <span id="detailTag"></span>
        <span id="detailYear"></span>
      </div>
      <h1 class="detail-title" id="detailTitle"></h1>
      <p class="detail-text" id="detailText"></p>
      <div class="detail-images" id="detailImages"></div>
    </div>
  </div>

  <!-- Lightbox : agrandit en plein écran l'image cliquée dans la page détail -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Aperçu en plein écran" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button">fermer <span aria-hidden="true">×</span></button>
    <div class="lightbox-content" id="lightboxContent"></div>
  </div>

  <!-- Curseur personnalisé : petit cercle en mix-blend-mode qui suit la souris (voir script.js) -->
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <script src="script.js" defer></script>

</body>
</html>
