<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplitsch Vladimir — Graphisme</title>
  <meta name="description" content="Portfolio de graphisme de Vladimir Toplitsch — édition, affiche et identité visuelle.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <p class="logo">toplitsch vladimir <span>gr.</span></p>
    <nav>
      <a href="https://www.instagram.com/vladtplsch" target="_blank" rel="noopener noreferrer">instagram</a>
    </nav>
  </header>

  <!-- Pagination : un point par projet, généré et mis à jour en JS -->
  <nav class="pagination" id="pagination" aria-label="Navigation entre les projets"></nav>

  <main class="scroll-container" id="scrollContainer">

    <section class="project-section" id="project-0" data-project="0" tabindex="0" role="button"
              aria-haspopup="dialog" aria-label="Voir le projet : Agenda">
      <img src="images/IMG_2605.jpg" alt="Couverture du projet Agenda" class="project-bg" loading="eager">
      <div class="project-content">
        <span class="project-meta project-tag">édition</span>
        <h2 class="project-title">agenda</h2>
        <span class="project-meta project-year">projet graphique – 2026</span>
      </div>
    </section>

    <section class="project-section" id="project-1" data-project="1" tabindex="0" role="button"
              aria-haspopup="dialog" aria-label="Voir le projet : Affiche workshop Guillaume Besson">
      <img src="images/IMG_2607.jpg" alt="Affiche du workshop typographique de Guillaume Besson" class="project-bg" loading="lazy">
      <div class="project-content">
        <span class="project-meta project-tag">affiche</span>
        <h2 class="project-title">affiche workshop guillaume besson</h2>
        <span class="project-meta project-year">workshop – 2026</span>
      </div>
    </section>

    <section class="project-section" id="project-2" data-project="2" tabindex="0" role="button"
              aria-haspopup="dialog" aria-label="Voir le projet : Affiche Nifff">
      <img src="IMG_2606.jpg" alt="Affiche du Nifff" class="project-bg" loading="lazy">
      <div class="project-content">
        <span class="project-meta project-tag">affiche / flyer</span>
        <h2 class="project-title">affiche nifff</h2>
        <span class="project-meta project-year">design – 2026</span>
      </div>
    </section>

    <section class="project-section" id="project-3" data-project="3" tabindex="0" role="button"
              aria-haspopup="dialog" aria-label="Voir le projet : Coupe du monde 2026">
      <img src="https://images.unsplash.com/photo-1509343256512-d77a5cb3791b?w=1800&q=80"
           alt="Visuel du projet Coupe du monde 2026, en collaboration avec Zinema" class="project-bg" loading="lazy">
      <div class="project-content">
        <span class="project-meta project-tag">collaboration zinema</span>
        <h2 class="project-title">coupe du monde 2026</h2>
        <span class="project-meta project-year">2026</span>
      </div>
    </section>

  </main>

  <footer>
    <span>lausanne – rue du maupas 4, 1004</span>
    <a href="mailto:vltoplitsch@gmail.com">vltoplitsch@gmail.com</a>
  </footer>

  <!-- Page de détail : un seul gabarit, rempli dynamiquement selon le projet cliqué -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <button class="detail-close" id="detailClose" type="button">fermer ×</button>
    <div class="detail-inner">
      <div class="detail-meta">
        <span id="detailTag"></span>
        <span id="detailYear"></span>
      </div>
      <h1 class="detail-title" id="detailTitle"></h1>
      <p class="detail-text" id="detailText"></p>
      <div class="detail-images" id="detailImages"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
